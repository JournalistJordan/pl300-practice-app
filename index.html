function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    margin: 10px 0 14px;
    white-space: pre-wrap;
  }
  .pl3-callout {
    border-left: 5px solid #D4A820;
    background: #fbf6e7;
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    margin-top: 14px;
    font-size: 14.5px;
  }
  .pl3-callout strong { font-family: Arial, Helvetica, sans-serif; }
  .pl3-progress-track {
    height: 8px;
    background: #e3ded2;
    border-radius: 4px;
    overflow: hidden;
    margin: 14px 0 4px;
  }
  .pl3-progress-fill { height: 100%; background: #D4A820; transition: width 0.3s; }
  .pl3-meta {
    display: flex;
    justify-content: space-between;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12.5px;
    color: #6b6557;
    margin-bottom: 4px;
  }
  .pl3-bar-row { margin-bottom: 14px; }
  .pl3-bar-label {
    display: flex;
    justify-content: space-between;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13.5px;
    margin-bottom: 4px;
  }
  .pl3-bar-track { height: 14px; background: #e3ded2; border-radius: 7px; overflow: hidden; }
  .pl3-bar-fill { height: 100%; background: #1B4332; border-radius: 7px; }
  .pl3-bar-fill.weak { background: #b3413a; }
  .pl3-score-big {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 48px;
    font-weight: bold;
    color: #1B4332;
    margin: 4px 0 0;
  }
  .pl3-tag {
    display: inline-block;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11.5px;
    font-weight: bold;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    background: #ecf5ef;
    color: #1B4332;
    border-radius: 20px;
    padding: 3px 10px;
    margin-right: 6px;
  }
  @media (max-width: 480px) {
    .pl3-header h1 { font-size: 21px; }
    .pl3-card { padding: 16px; }
    .pl3-score-big { font-size: 38px; }
  }
`;

function PL300PracticeApp() {
  const [screen, setScreen] = useState("home");
  const [mode, setMode] = useState("");
  const [quiz, setQuiz] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answers, setAnswers] = useState([]);

  const startQuiz = (chosenMode) => {
    let pool;
    if (chosenMode === "dax") {
      pool = QUESTIONS.filter((q) => q.domain === "Model the Data");
    } else if (chosenMode === "full") {
      pool = QUESTIONS;
    } else {
      pool = QUESTIONS.filter((q) => q.domain === chosenMode);
    }
    setQuiz(shuffle(pool));
    setMode(chosenMode);
    setQIndex(0);
    setSelected(null);
    setAnswers([]);
    setScreen("quiz");
  };

  const chooseAnswer = (i) => {
    if (selected !== null) return;
    setSelected(i);
    setAnswers((prev) => [...prev, { q: quiz[qIndex], picked: i }]);
  };

  const next = () => {
    if (qIndex + 1 >= quiz.length) {
      setScreen("results");
    } else {
      setQIndex(qIndex + 1);
      setSelected(null);
    }
  };

  const modeLabel =
    mode === "full" ? "Full Practice" : mode === "dax" ? "DAX Focus" : mode;

  // ---------- Home ----------
  if (screen === "home") {
    return (
      <div className="pl3-root">
        <style>{css}</style>
        <header className="pl3-header">
          <h1>PL-300 Practice Studio</h1>
          <p>Domain-weighted practice for the Microsoft Power BI Data Analyst exam</p>
        </header>
        <div className="pl3-wrap">
          <div className="pl3-card">
            <div className="pl3-eyebrow">Exam blueprint</div>
            <h2 style={{ marginTop: 0, fontSize: 19 }}>
              Four domains, weighted like the real exam
            </h2>
            <table className="pl3-domain-table">
              <tbody>
                {Object.entries(DOMAIN_INFO).map(([d, info]) => (
                  <tr key={d}>
                    <td>{d}</td>
                    <td>
                      {QUESTIONS.filter((q) => q.domain === d).length} questions
                      &nbsp;|&nbsp; exam weight {info.weight}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p style={{ fontSize: 14, color: "#6b6557", marginBottom: 0 }}>
              This bank is intentionally heavier on Model the Data because DAX and
              modeling concepts carry the hardest scenario questions on the exam.
            </p>
          </div>

          <div className="pl3-card">
            <div className="pl3-eyebrow">Choose a session</div>
            <h2 style={{ marginTop: 0, fontSize: 19 }}>Start practicing</h2>
            <div className="pl3-mode-row">
              <button className="pl3-btn" onClick={() => startQuiz("full")}>
                Full Practice ({QUESTIONS.length} questions)
              </button>
              <button className="pl3-btn gold" onClick={() => startQuiz("dax")}>
                DAX Focus (
                {QUESTIONS.filter((q) => q.domain === "Model the Data").length}{" "}
                questions)
              </button>
            </div>
            <div className="pl3-mode-row">
              {Object.keys(DOMAIN_INFO)
                .filter((d) => d !== "Model the Data")
                .map((d) => (
                  <button
                    key={d}
                    className="pl3-btn ghost"
                    onClick={() => startQuiz(d)}
                  >
                    {DOMAIN_INFO[d].short} only
                  </button>
                ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ---------- Quiz ----------
  if (screen === "quiz") {
    const q = quiz[qIndex];
    const progress = ((qIndex + (selected !== null ? 1 : 0)) / quiz.length) * 100;
    return (
      <div className="pl3-root">
        <style>{css}</style>
        <header className="pl3-header">
          <h1>PL-300 Practice Studio</h1>
          <p>{modeLabel} session</p>
        </header>
        <div className="pl3-wrap">
          <div className="pl3-meta pl3-ui">
            <span>
              Question {qIndex + 1} of {quiz.length}
            </span>
            <span>
              {q.domain} &middot; {q.difficulty}
            </span>
          </div>
          <div className="pl3-progress-track">
            <div className="pl3-progress-fill" style={{ width: progress + "%" }} />
          </div>

          <div className="pl3-card">
            <p style={{ marginTop: 0, fontSize: 16.5 }}>{q.question}</p>
            {q.code && <div className="pl3-code">{q.code}</div>}
            {q.options.map((opt, i) => {
              let cls = "pl3-option";
              if (selected !== null) {
                if (i === q.correctIndex) cls += " correct";
                else if (i === selected) cls += " wrong";
                else cls += " dim";
              }
              return (
                <button
                  key={i}
                  className={cls}
                  disabled={selected !== null}
                  onClick={() => chooseAnswer(i)}
                >
                  {String.fromCharCode(65 + i)}. {opt}
                </button>
              );
            })}

            {selected !== null && (
              <div className="pl3-callout">
                <strong>
                  {selected === q.correctIndex ? "Correct. " : "Not quite. "}
                </strong>
                {q.explanation}
              </div>
            )}

            {selected !== null && (
              <div style={{ marginTop: 16, textAlign: "right" }}>
                <button className="pl3-btn" onClick={next}>
                  {qIndex + 1 >= quiz.length ? "See results" : "Next question"}
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ---------- Results ----------
  const total = answers.length;
  const correct = answers.filter((a) => a.picked === a.q.correctIndex).length;
  const pct = total ? Math.round((correct / total) * 100) : 0;

  const domainStats = Object.keys(DOMAIN_INFO)
    .map((d) => {
      const inDomain = answers.filter((a) => a.q.domain === d);
      if (inDomain.length === 0) return null;
      const right = inDomain.filter((a) => a.picked === a.q.correctIndex).length;
      return {
        domain: d,
        right,
        count: inDomain.length,
        pct: Math.round((right / inDomain.length) * 100),
      };
    })
    .filter(Boolean);

  const weakest =
    domainStats.length > 1
      ? domainStats.reduce((min, s) => (s.pct < min.pct ? s : min), domainStats[0])
      : null;

  return (
    <div className="pl3-root">
      <style>{css}</style>
      <header className="pl3-header">
        <h1>PL-300 Practice Studio</h1>
        <p>{modeLabel} session results</p>
      </header>
      <div className="pl3-wrap">
        <div className="pl3-card" style={{ textAlign: "center" }}>
          <div className="pl3-eyebrow">Session score</div>
          <div className="pl3-score-big">{pct}%</div>
          <p style={{ marginTop: 4, color: "#6b6557" }}>
            {correct} of {total} correct
          </p>
          <span className="pl3-tag">
            {pct >= 80
              ? "Exam ready pace"
              : pct >= 65
              ? "Closing the gap"
              : "Keep building"}
          </span>
        </div>

        <div className="pl3-card">
          <div className="pl3-eyebrow">Domain diagnostic</div>
          <h2 style={{ marginTop: 0, fontSize: 19 }}>Where to focus next</h2>
          {domainStats.map((s) => (
            <div className="pl3-bar-row" key={s.domain}>
              <div className="pl3-bar-label">
                <span>{s.domain}</span>
                <span>
                  {s.right}/{s.count} ({s.pct}%)
                </span>
              </div>
              <div className="pl3-bar-track">
                <div
                  className={
                    "pl3-bar-fill" +
                    (weakest && s.domain === weakest.domain && s.pct < 80
                      ? " weak"
                      : "")
                  }
                  style={{ width: Math.max(s.pct, 4) + "%" }}
                />
              </div>
            </div>
          ))}
          {weakest && weakest.pct < 80 && (
            <div className="pl3-callout">
              <strong>Study recommendation: </strong>
              Your lowest domain this session was {weakest.domain} at{" "}
              {weakest.pct}%. Spend your next study block there, then rerun a
              focused session to measure the change.
            </div>
          )}
        </div>

        <div className="pl3-mode-row">
          <button className="pl3-btn" onClick={() => startQuiz(mode)}>
            Retry this session
          </button>
          <button className="pl3-btn ghost" onClick={() => setScreen("home")}>
            Back to home
          </button>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PL300PracticeApp />);

</script>
</body>
</html>
